name: Deploy site to GitHub Pages

# 两种用法二选一：
# 1) 分支模式（后台发布自动同步）：Pages Source 设为 gh-pages 分支，本工作流手动运行即可
# 2) Actions 模式：Pages Source 设为 GitHub Actions，手动运行本工作流（内容只来自仓库）
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      # data/ 不进仓库，build-site 会自动用 site 源文件播种；密码只用于这次临时构建
      - run: node scripts/build-site.mjs
        env:
          ADMIN_PASSWORD: ci-build-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
