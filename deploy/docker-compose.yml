services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      FH_SECURE_COOKIE: "1"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
    volumes:
      - ../data:/app/data
      - ../dist:/app/dist
    ports:
      - "127.0.0.1:8787:8787"
